<!DOCTYPE html>
<html lang="sk">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narodeninová výprava</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1b1640;--gold:#ffd166;--pin:#ff5d8f;--ok:#3ddc97;--lock:#4a4380;--ink:#fff7ee;--soft:#c9c0ee;--sheet:#241d54}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 16px;max-width:520px;width:100%;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:19px;font-weight:700;margin:0;line-height:1.15}
.pts{background:var(--gold);color:#3a2a00;font-weight:700;border-radius:999px;padding:5px 14px;font-size:18px;transition:transform .2s}
.pts.pop{transform:scale(1.2)}
.bar{height:9px;background:#00000040;border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pin),var(--gold));border-radius:99px;transition:width .6s}
.lvl{font-size:13px;color:var(--soft);margin-top:5px;display:flex;justify-content:space-between;gap:8px}
#map{flex:1;min-height:0;background:#1b1640}
.leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(.85) saturate(.9)}
.leaflet-control-attribution{font-size:9px;background:#0007!important;color:#ccc!important}
.leaflet-control-attribution a{color:#ddd!important}
.pin{width:44px;height:44px;border-radius:50%;background:var(--pin);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 3px 10px #0008;position:relative}
.pin.done{background:var(--ok)}.pin.lock{background:var(--lock);filter:grayscale(.4)}
.pin.act::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--pin);z-index:-1;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
.me{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 0 0 6px #7aa2ff66,0 3px 10px #0008}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px #0008;z-index:1000;max-height:85%;overflow:auto}
.sheet.open{transform:none}
.sheet h2{margin:0 40px 4px 0;font-size:22px}
.story{color:var(--soft);margin:0 0 12px;line-height:1.45}
.task{background:#00000033;border-radius:14px;padding:12px 14px;line-height:1.45;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid #ffffff22;background:#00000033;color:var(--ink)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 18px;background:var(--pin);color:#fff;cursor:pointer;text-align:center;text-decoration:none;display:block}
button.alt,.btn.alt{background:#ffffff1a;color:var(--ink)}
.full{width:100%;font-size:17px}
input:focus-visible,button:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.close{position:absolute;right:14px;top:14px;padding:6px 12px}
.msg{min-height:20px;font-size:14px;color:var(--gold);margin-top:6px}
.dist{font-weight:600;color:var(--gold)}
.fx{position:fixed;left:50%;top:40%;margin-left:-30px;font-weight:700;color:var(--gold);font-size:30px;pointer-events:none;z-index:2000;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-80px);opacity:0}}
.fin{position:fixed;inset:0;background:#120e30ee;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:3000}
.fin.show{display:flex}
.fin h2{font-size:34px;margin:10px 0}
.fin p{max-width:340px;line-height:1.5;color:var(--soft);font-size:18px}
.c{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:3001}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.reset{background:none;color:var(--soft);font-size:12px;font-weight:400;margin:14px auto 0}
#intro{position:fixed;inset:0;background:#000;z-index:5000;display:none;align-items:center;justify-content:center;color:#fff;text-align:center}
#intro.show{display:flex}
#stage{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,#3a2d8f,#120e30)}
#stage video,#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cap{position:absolute;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:0 24px;font-size:24px;font-weight:600;text-shadow:0 2px 14px #000;line-height:1.3;z-index:2}
#segs{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px;z-index:2}
#segs i{flex:1;height:3px;border-radius:3px;background:#ffffff55}
#segs i.on{background:#fff}
#skip{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:12px;z-index:4;padding:6px 12px;font-size:14px;display:none}
#cut{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#cut.go{animation:cut .45s ease-out}
@keyframes cut{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.card{position:relative;z-index:2;padding:30px;max-width:380px}
.card h2{font-size:32px;margin:12px 0}
.card p{color:var(--soft);font-size:18px;line-height:1.5;margin:0 0 22px}
.big{font-size:60px}
.gift{font-size:20px}
.me img,.pin img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.pin.img{overflow:hidden;padding:0}
#ep{position:fixed;right:8px;top:calc(104px + env(safe-area-inset-top,0px));z-index:1500;background:var(--sheet);border-radius:12px;padding:10px;max-width:82vw;font-size:12px;box-shadow:0 4px 20px #0009;display:none}
#ep pre{margin:6px 0;white-space:pre-wrap;color:var(--soft);font-family:inherit}
#ep button{padding:6px 10px;font-size:13px}
.anim{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#4a2a9f,#120e30 70%)}
.anim .nm{font-size:min(22vw,110px);font-weight:700;display:flex;color:var(--gold);text-shadow:0 0 30px #ff5d8f;position:relative;z-index:1}
.anim .nm span,.pp{display:inline-block;opacity:0;transform:translateY(40px) scale(.3) rotate(-20deg);animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
.pp{transform:scale(.4);animation-duration:.9s;animation-delay:.2s;width:min(70vw,300px);position:relative;z-index:1}
@keyframes pop{to{opacity:1;transform:none}}
.anim .sub{margin-top:14px;font-size:24px;font-weight:600;opacity:0;animation:fadein 1s 1.8s forwards;position:relative;z-index:1;text-align:center;padding:0 20px}
@keyframes fadein{to{opacity:1}}
.hr{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-110vh) scale(1.2) rotate(20deg);opacity:0}}
.st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.1;transform:scale(2)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.85,1.12) translateX(1px)}}
.cf{position:absolute;top:-20px;width:8px;height:12px;animation:fall linear forwards}
@media (prefers-reduced-motion:reduce){.anim .nm span,.anim .sub,.pp{animation:none;opacity:1;transform:none}.hr,.st,.cf,.fl{display:none}}
@media (prefers-reduced-motion:reduce){.pin.act::after{animation:none}#cut.go{animation:none}}

/* ===== UI v2 ===== */
body{display:block;padding-top:0}
#map{position:fixed;inset:0;z-index:0}
header{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;width:auto;max-width:500px;margin:0 auto;padding:10px 14px 9px;z-index:900;background:rgba(36,29,84,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #ffffff1f;border-radius:20px;box-shadow:0 8px 28px #0007}
h1{font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts::before{content:"⭐ "}
.pts{flex:none}
.pin{background:radial-gradient(circle at 30% 25%,#ff9ec0,#ff5d8f 55%,#d6336c);box-shadow:0 6px 14px #0009,inset 0 -4px 8px #0003;font-size:23px}
.pin.done{background:radial-gradient(circle at 30% 25%,#8af5c6,#3ddc97 55%,#1fa86e)}
.pin.lock{background:radial-gradient(circle at 30% 25%,#6b62b0,#4a4380 60%,#352f66)}
.pin.img{overflow:visible}
.pin .n{position:absolute;right:-7px;top:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#3a2a00;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 4px;font-style:normal}
.pin.act{animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-6px)}}
#next{position:fixed;left:10px;right:10px;bottom:calc(26px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;z-index:800;display:none;align-items:center;gap:12px;padding:12px 14px;background:rgba(36,29,84,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #ffffff22;border-radius:20px;box-shadow:0 8px 28px #0008;cursor:pointer;transition:transform .1s}
#next:active{transform:scale(.98)}
#next.show{display:flex}
#next .ni{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ff9ec0,#ff5d8f 55%,#d6336c);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;overflow:hidden}
#next .ni img{width:100%;height:100%;object-fit:cover}
#next .nt{flex:1;min-width:0}
#next small{display:block;color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
#next b{display:block;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#next .nd{color:var(--gold);font-size:14px;font-weight:600}
#next .go{font-size:30px;color:var(--soft);line-height:1}
#snd{position:fixed;left:12px;top:calc(122px + env(safe-area-inset-top,0px));z-index:850;width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:rgba(36,29,84,.82);border:1px solid #ffffff22;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0007}
#ep{top:calc(122px + env(safe-area-inset-top,0px))}
.sheet{background:linear-gradient(180deg,#2e2569,#241d54);border:1px solid #ffffff1a;border-bottom:0}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#ffffff33;margin:-8px auto 14px}
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:10px;padding-right:76px}
.qi{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ff9ec0,#ff5d8f 55%,#d6336c);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:31px;flex:none;box-shadow:0 6px 16px #0007;overflow:hidden}
.qi img{width:100%;height:100%;object-fit:cover}
.qpts{display:inline-block;background:var(--gold);color:#3a2a00;font-weight:700;font-size:12px;border-radius:99px;padding:2px 10px;margin-bottom:4px}
.sheet h2{margin:0;font-size:22px;line-height:1.15}
button{transition:transform .1s,filter .15s}
button:active{transform:scale(.96)}
button.full:not(.alt),#ok{background:linear-gradient(180deg,#ff7aa6,#ff4d82);box-shadow:0 4px 0 #b32e5a}
button.full:not(.alt):active,#ok:active{transform:translateY(3px);box-shadow:0 1px 0 #b32e5a}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fx{font-size:42px;text-shadow:0 3px 14px #000b}
.fin{background:radial-gradient(circle at 50% 30%,#3a2d8f,#120e30 75%)}
.fin>div:first-child{animation:bounce 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pin.act,.fin>div:first-child,.shake{animation:none}}
#codes{position:fixed;inset:0;z-index:9000;background:#fff;color:#222;overflow:auto;padding:20px;font-family:system-ui,sans-serif}
#codes .cw{max-width:640px;margin:0 auto}
#codes h1{white-space:normal;font-size:24px}
#codes .ec{border:2px dashed #999;border-radius:12px;padding:12px 14px;margin:12px 0;break-inside:avoid;line-height:1.5}
#codes .cd{font-size:34px;font-weight:700;letter-spacing:.12em;margin:6px 0;color:#d6336c}
#codes button{display:inline-block;margin:6px 6px 0 0}
@media print{#codes button{display:none}}
#env{position:fixed;inset:0;z-index:4000;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#3a2d8f,#120e30 75%);--w:min(78vw,320px)}
#env.show{display:flex}
#evt{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:22px;font-weight:700;color:var(--gold)}
.ev{position:relative;width:var(--w);height:calc(var(--w)*.64);cursor:pointer;animation:evdrop .8s cubic-bezier(.3,1.4,.5,1) both,evwob 2s 1s ease-in-out infinite}
@keyframes evdrop{from{transform:translateY(-70vh) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes evwob{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
#env.open .ev{animation:none}
.ev>div{position:absolute}
.ev-back{inset:0;background:#b9783c;border-radius:6px;box-shadow:0 18px 40px #0009}
.ev-front{inset:0;background:linear-gradient(160deg,#f0c48a,#dca066);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:6px;z-index:3}
.ev-flap{left:0;right:0;top:0;height:58%;background:linear-gradient(#e6b27a,#cf955a);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transform:perspective(800px) rotateX(0);z-index:4;transition:transform .55s ease,z-index 0s .27s}
#env.open .ev-flap{transform:perspective(800px) rotateX(180deg);z-index:1}
.ev .ev-seal{left:50%;top:44%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#ff5d8f;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:5;box-shadow:0 3px 8px #0006;transition:opacity .3s}
#env.open .ev-seal{opacity:0}
.ev .ev-letter{left:6%;right:6%;top:8%;height:80%;background:#fffaf0;color:#3a2a1a;border-radius:6px;z-index:2;padding:12px 10px;text-align:center;overflow:hidden;transition:transform .8s cubic-bezier(.3,1,.4,1);box-shadow:0 -2px 10px #0003}
#env.rise .ev-letter{transform:translateY(-62%)}
#env.read .ev-letter{z-index:6;height:auto;min-height:80%;overflow:visible;transform:translateY(-52%) scale(1.22);transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.lt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a08060}
.lc{font-size:34px;font-weight:700;letter-spacing:.1em;color:#d6336c;margin:8px 0;word-break:break-all}
.lc span{display:inline-block;opacity:0;transform:scale(.3)}
#env.read .lc span{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i)*.09s + .3s)}
.ln{font-size:14px;line-height:1.35;color:#5a4630;opacity:0;transition:opacity .4s .5s}
#env.read .ln{opacity:1}
.ev-hint{margin-top:34px;color:var(--soft);font-size:18px;animation:fadepulse 1.4s ease-in-out infinite}
@keyframes fadepulse{50%{opacity:.35}}
#env.open .ev-hint{display:none}
#evb{display:none;margin-top:56px;width:min(78vw,320px)}
@media (prefers-reduced-motion:reduce){.ev,.ev-hint{animation:none}.lc span{opacity:1!important;transform:none!important;animation:none!important}.ev-flap,.ev .ev-letter{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top"><h1 id="title"></h1><div class="pts" id="pts">0</div></div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:8px"><div class="bar" style="flex:1;margin-top:0"><i id="bar"></i></div><span class="gift" id="gift">🔒🎁</span></div>
  <div class="lvl"><span id="lvl"></span><span id="dist"></span></div>
</header>
<div id="map"></div>
<button id="snd" aria-label="Zvuk zapnúť alebo vypnúť">🔊</button>
<div id="next" role="button" tabindex="0" aria-label="Otvoriť ďalšiu misiu"><div class="ni" id="ni"></div><div class="nt"><small>Ďalšia misia</small><b id="nn"></b><span class="nd" id="nd"></span></div><span class="go">›</span></div>
<div id="ep"><b>Režim úprav: ťahaj piny po mape</b><pre id="ept"></pre><button id="epc">Kopírovať súradnice</button></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close alt" id="x">Zavrieť</button>
  <div class="qhead"><div class="qi" id="qi"></div><div><span class="qpts" id="qp"></span><h2 id="qt"></h2></div></div>
  <p class="story" id="qs"></p>
  <div class="task" id="qk"></div>
  <div id="far">
    <a class="btn alt" id="nav" target="_blank" rel="noopener" style="margin-bottom:8px">Navigovať v mapách</a>
    <button class="full" id="here">Som na mieste</button>
  </div>
  <div class="row" id="codeRow"><input id="code" placeholder="Tajná odpoveď" autocomplete="off"><button id="ok">Skontrolovať</button></div>
  <button class="full" id="done">Misia splnená</button>
  <button class="alt full" id="evbtn" style="margin-top:8px;display:none">✉️ Zobraziť obálku s kódom</button>
  <button class="alt full" id="hint" style="margin-top:8px">Potrebuješ nápovedu? (−10 bodov)</button>
  <div class="msg" id="msg" aria-live="polite"></div>
</div>

<div id="env" aria-live="polite">
  <div id="evt">Misia splnená! 🎉</div>
  <div class="ev" id="ev" role="button" tabindex="0" aria-label="Otvoriť obálku">
    <div class="ev-back"></div>
    <div class="ev-letter" id="evl"><div class="lt">Kód z obálky</div><div class="lc" id="evc"></div><div class="ln" id="evn"></div></div>
    <div class="ev-front"></div>
    <div class="ev-flap"></div>
    <div class="ev-seal">💌</div>
  </div>
  <div class="ev-hint" id="evh">Ťukni na obálku</div>
  <button class="full" id="evb">Pokračovať</button>
</div>

<div id="intro">
  <div id="stage"><div id="cut"></div></div>
  <div id="segs"></div>
  <button class="alt" id="skip">Preskočiť</button>
  <div id="cap"></div>
  <div class="card" id="start"><div class="big">🎬</div><h2 id="sh"></h2><p id="sp"></p><button class="full" id="play">▶ Spustiť</button></div>
  <div class="card" id="gate" style="display:none"><div class="big">🎁</div><h2>Darček je zamknutý</h2><p id="gp"></p><button class="full" id="go">Začať hru</button></div>
</div>

<div class="fin" id="fin">
  <div style="font-size:64px">🎂</div>
  <h2 id="fh"></h2><p id="fp"></p>
  <button class="reset" id="again">Hrať znova</button>
  <button class="reset" id="replay" style="margin-top:0">Pozrieť úvod znova</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
